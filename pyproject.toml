[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-classifier"
version = "0.1.0"
description = "Mostly-deterministic JEV-based classifier with epistemic/bitemporal claim records"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "rdflib>=7.0",
]
ontology = [
  "rdflib>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: optional live OpenRouter Decisions calls (skipped without OPENROUTER_API_KEY)",
]